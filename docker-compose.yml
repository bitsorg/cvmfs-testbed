# docker-compose.yml — CVMFS testbed service deployment.
#
# Each service extends a canonical base definition from cvmfs-elements/compose/.
# The base files supply: image name, build context (in cvmfs-elements/), fixed
# command, intrinsic capabilities, and public-image volumes (monitoring).
#
# This file supplies only what is testbed-specific:
#   - environment: secrets and per-instance variables
#   - volumes: with ${TESTBED_ROOT} and ${SOFTWARE_ROOT} paths
#   - ports: (testbed exposes services directly; production goes through Nginx)
#   - depends_on: (testbed-specific startup ordering)
#
# Requires Docker Compose v2 (docker compose plugin).

services:

  # ── Gateway — cvmfs_gateway + cvmfs_receiver lease manager ──────────────
  gateway:
    extends:
      file: ./cvmfs-elements/compose/core.yml
      service: gateway
    environment:
      CVMFS_GATEWAY_KEY_ID: ${CVMFS_GATEWAY_KEY_ID}
      CVMFS_GATEWAY_SECRET: ${CVMFS_GATEWAY_SECRET}
      # REPO_NAME is passed to the gateway entrypoint so it can pre-create the
      # per-repo spool files (client.local, reflog.chksum) before starting.
      REPO_NAME: ${REPO_NAME}
      # cvmfs_receiver is a C++ binary linked against libcvmfs_crypto.so and friends
      # that live in SOFTWARE_ROOT.  Setting LD_LIBRARY_PATH here makes it available
      # to every subprocess the gateway spawns (exec.Command inherits the environment).
      LD_LIBRARY_PATH: /opt/cvmfs-software
    volumes:
      - ${SOFTWARE_ROOT}/cvmfs_gateway:/usr/local/bin/cvmfs_gateway:ro
      # cvmfs_gateway spawns cvmfs_receiver as a subprocess; hardcoded default path
      # is /usr/bin/cvmfs_receiver (see gateway/internal/gateway/config.go:52).
      - ${SOFTWARE_ROOT}/cvmfs_receiver:/usr/bin/cvmfs_receiver:ro
      # Stub for the cvmfs-server statistics upload script that the gateway calls
      # but that isn't present in this lightweight container image.
      - ${SOFTWARE_ROOT}/upload_stats_plots.sh:/usr/share/cvmfs-server/upload_stats_plots.sh:ro
      # Mount the full SOFTWARE_ROOT so cvmfs_receiver can resolve its shared libs.
      - ${SOFTWARE_ROOT}:/opt/cvmfs-software:ro
      - ${TESTBED_ROOT}/config/gateway:/etc/cvmfs/gateway:ro
      - ${TESTBED_ROOT}/repos/${REPO_NAME}:/srv/cvmfs/${REPO_NAME}
      - ${TESTBED_ROOT}/config/keys:/etc/cvmfs/keys:ro
      # cvmfs_receiver reads /etc/cvmfs/repositories.d/<repo>/server.conf for
      # CVMFS_STRATUM0, CVMFS_UPSTREAM_STORAGE, CVMFS_HASH_ALGORITHM, and other
      # parameters.  This file is created by cvmfs_server mkfs on the host and
      # copied into config/repo-config/ by init.sh.
      - ${TESTBED_ROOT}/config/repo-config:/etc/cvmfs/repositories.d/${REPO_NAME}:ro
      # Canonical S3 config, written once by init.sh.  With STORAGE=s3 the
      # receiver's CVMFS_UPSTREAM_STORAGE is S3,...,<repo>@/etc/cvmfs/s3/<repo>.s3.conf
      # and it reads its credentials from here.  Mounted as a DIRECTORY, not a
      # file: Docker auto-creates a bind-mount source that does not exist, and a
      # directory created where a file belongs makes the container refuse to
      # start with "not a directory" once the real file appears.
      - ${TESTBED_ROOT}/config/s3:/etc/cvmfs/s3:ro
      # cvmfs_receiver spool directory — bind-mounted to the host so that:
      #   1. client.local and reflog.chksum survive container restarts.
      #   2. upstream-scratch/ (temp chunks) uses host FS, avoiding overlay overhead.
      #   3. The spool tree is readable from the host for debugging.
      # The gateway entrypoint creates the required files on startup.
      - ${TESTBED_ROOT}/data/gateway-spool:/var/spool/cvmfs
      # cvmfs_receiver debug log — bind-mounted so the log is readable from the
      # host after a receiver crash.  Read it with:
      #   cat ${TESTBED_ROOT}/data/receiver-logs/debug.log
      - ${TESTBED_ROOT}/data/receiver-logs:/var/log/cvmfs_receiver
    ports:
      - "4929:4929"

  # ── Stratum 0 — Apache httpd serving the CAS over HTTP ──────────────────
  stratum0:
    extends:
      file: ./cvmfs-elements/compose/core.yml
      service: stratum0
    volumes:
      - ${TESTBED_ROOT}/repos:/usr/local/apache2/htdocs/cvmfs:ro
    ports:
      - "8090:80"
    depends_on:
      - gateway

  # ── cvmfs-prepub — REST API front-end and job orchestrator ───────────────
  cvmfs-prepub:
    extends:
      file: ./cvmfs-elements/compose/core.yml
      service: cvmfs-prepub
    environment:
      PREPUB_API_TOKEN: ${PREPUB_API_TOKEN}
      CVMFS_GATEWAY_SECRET: ${CVMFS_GATEWAY_SECRET}
      CVMFS_GATEWAY_KEY_ID: ${CVMFS_GATEWAY_KEY_ID}
      PREPUB_HMAC_SECRET: ${PREPUB_HMAC_SECRET}
      # Needed by the `ingest` publish path: prepub runs `cvmfs_server ingest`,
      # whose swissknife children inherit this container's environment.
      REPO_NAME: ${REPO_NAME}
      LD_LIBRARY_PATH: /opt/cvmfs-software
      # S3 CAPABILITY (not a mode) plus MinIO credentials, interpolated from
      # .env.s3, which testbed.sh merges in when present. With S3_ENABLED=1 the
      # entrypoint writes /etc/cvmfs/<repo>.s3.conf and MinIO runs; WHICH path a
      # publish takes is then chosen per job, by prepub passing --direct-s3.
      # All defaulted: with no .env.s3 there is no capability and nothing
      # changes. See .env.s3.example.
      S3_ENABLED: ${S3_ENABLED:-0}
      S3_BUCKET: ${S3_BUCKET:-cvmfs}
      S3_HOST: ${S3_HOST:-minio}
      S3_PORT: ${S3_PORT:-9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PARALLEL: ${S3_PARALLEL:-16}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      # Where `cvmfs_server ingest --direct-s3` reads its S3 settings from.
      # Points at the canonical file init.sh writes, instead of the
      # conventional /etc/cvmfs/<repo>.s3.conf the entrypoint used to generate
      # per container — so prepub, the gateway receiver and the native
      # publisher cannot disagree about which bucket the repository lives in.
      CVMFS_INGEST_DIRECT_S3_CONFIG: /etc/cvmfs/s3/${REPO_NAME}.s3.conf
    volumes:
      # Canonical S3 config (directory mount — see the gateway service).
      - ${TESTBED_ROOT}/config/s3:/etc/cvmfs/s3:ro
      - ${SOFTWARE_ROOT}/cvmfs-prepub:/usr/local/bin/cvmfs-prepub:ro
      - ${TESTBED_ROOT}/repos/${REPO_NAME}:/data/cas
      - ${TESTBED_ROOT}/data/spool:/data/spool
      - ${TESTBED_ROOT}/config/cvmfs-prepub/config.yaml:/etc/cvmfs-prepub/config.yaml:ro
      # ── `ingest` publish path (--ingest-publish) ──────────────────────────
      # Mirrors cvmfs-native-publisher, which already runs `cvmfs_server
      # ingest` in a container.  Mountless (connect-gw -P): no /cvmfs mount,
      # no /dev/fuse, no SYS_ADMIN.  cvmfs_server detects this itself —
      #   if ! is_mounted "/cvmfs/$name" && ! is_mounted "$CVMFS_SPOOL_DIR/rdonly"
      # (cvmfs_server_ingest.sh) — and takes the gateway-lease path.
      - ${SOFTWARE_ROOT}:/opt/cvmfs-software:ro
      - ${SOFTWARE_ROOT}/cvmfs_server:/usr/local/bin/cvmfs_server:ro
      - ${SOFTWARE_ROOT}/cvmfs_swissknife:/usr/local/bin/cvmfs_swissknife:ro
      - ${SOFTWARE_ROOT}/cvmfs_publish:/usr/local/bin/cvmfs_publish:ro
      # Signing keys plus <repo>.gw, which cvmfs_server_ingest.sh reads from a
      # hardcoded /etc/cvmfs/keys/<name>.gw.
      - ${TESTBED_ROOT}/config/keys:/etc/cvmfs/keys:ro
      # Repository config.  A SEPARATE copy from native-publisher/, differing
      # in exactly one line: CVMFS_USER=prepub instead of root.
      #
      # It cannot be shared.  cvmfs_server's get_user_shell() picks "sh -c" only
      # when whoami == CVMFS_USER, and "su -m $CVMFS_USER -c" only when running
      # as root; with CVMFS_USER=root and a non-root caller NEITHER branch is
      # taken, the shell command stays empty, and cvmfs_server then runs the
      # whole swissknife command string as a single command name —
      #   cvmfs_server: eval: cvmfs_swissknife ingest -u ... : not found
      # for a binary that exists and runs fine on its own.
      #
      # Everything else is copied verbatim (same repository, same gateway, same
      # chunking), so comparing the two publish paths remains meaningful.
      - ${TESTBED_ROOT}/config/prepub-publisher:/etc/cvmfs/repositories.d/${REPO_NAME}:ro
      # SEPARATE spool from the native publisher.  Same path inside the
      # container, different host directory: the two paths must not share
      # transaction locks, session tokens or stats.db, or a failure in one
      # would show up as a mystery in the other.
      - ${TESTBED_ROOT}/data/prepub-ingest:/var/spool/cvmfs
    # Overrides core.yml so the testbed offers BOTH publish paths and they can
    # be compared on one repository.  Deliberately set here rather than in
    # cvmfs-elements/compose/core.yml: that file is shared with deployments
    # that have no gateway registration, where --ingest-publish would fail the
    # startup probe.  docker-compose.pull-wss.yml replaces `command` wholesale,
    # so it carries the same flag — change one, change both.
    command: >
      /usr/local/bin/cvmfs-prepub
      --config /etc/cvmfs-prepub/config.yaml
      --ingest-publish
    ports:
      - "8080:8080"
    depends_on:
      - gateway
      - stratum0

  # ── Stratum 1 receivers — cvmfs-prepub in receiver mode ─────────────────
  stratum1-a:
    extends:
      file: ./cvmfs-elements/compose/receivers.yml
      service: stratum1
    container_name: cvmfs-stratum1-a
    environment:
      PREPUB_HMAC_SECRET: ${PREPUB_HMAC_SECRET}
      NODE_ID: stratum1-a
    volumes:
      - ${SOFTWARE_ROOT}/cvmfs-prepub:/usr/local/bin/cvmfs-prepub:ro
      - ${TESTBED_ROOT}/data/s1a:/data/cas
      - ${TESTBED_ROOT}/config/stratum1-a/config.yaml:/etc/cvmfs-prepub/config.yaml:ro
    ports:
      - "9101:9100"
      - "9111:9101"

  stratum1-b:
    extends:
      file: ./cvmfs-elements/compose/receivers.yml
      service: stratum1
    container_name: cvmfs-stratum1-b
    environment:
      PREPUB_HMAC_SECRET: ${PREPUB_HMAC_SECRET}
      NODE_ID: stratum1-b
    volumes:
      - ${SOFTWARE_ROOT}/cvmfs-prepub:/usr/local/bin/cvmfs-prepub:ro
      - ${TESTBED_ROOT}/data/s1b:/data/cas
      - ${TESTBED_ROOT}/config/stratum1-b/config.yaml:/etc/cvmfs-prepub/config.yaml:ro
    ports:
      - "9102:9100"
      - "9112:9101"

  # ── publisher — bits publish jobs via cvmfs-prepub REST API ─────────────
  publisher:
    extends:
      file: ./cvmfs-elements/compose/publishers.yml
      service: publisher
    environment:
      PREPUB_API_TOKEN: ${PREPUB_API_TOKEN}
      PREPUB_URL: http://cvmfs-prepub:8080
      REPO_NAME: ${REPO_NAME}
      RUN_LOG_FILE: /data/runs.ndjson
    volumes:
      - ${TESTBED_ROOT}/data/runs.ndjson:/data/runs.ndjson
      # ADR-0001: shared canonical test payload (generated once host-side).
      - ${TESTBED_ROOT}/data/payload:/data/payload:ro
    depends_on:
      - cvmfs-prepub

  # ── Bootstrap — one-shot privileged container that seeds the repository ────
  # Creates the nested-catalog structure that cvmfs_server ingest requires.
  # Run once after init, or restore from the snapshot it produces.
  # Invoked by: ./testbed.sh bootstrap  (or: make bootstrap)
  cvmfs-bootstrap:
    extends:
      file: ./cvmfs-elements/compose/publishers.yml
      service: cvmfs-bootstrap
    environment:
      REPO_NAME: ${REPO_NAME}
      NESTED_CATALOG_PATH: golden/smoke
    volumes:
      # CVMFS binaries and shared libraries — mounted read-only; bootstrap.sh
      # stages copies to a tmpfs path and sets caps/suid there.
      - ${SOFTWARE_ROOT}:/opt/cvmfs-software:ro
      # Signing keys — read-only; mkfs has already written them during init.
      - ${TESTBED_ROOT}/config/keys:/etc/cvmfs/keys:ro
      # Canonical S3 config (directory mount — see the gateway service).
      - ${TESTBED_ROOT}/config/s3:/etc/cvmfs/s3:ro
      # Server config — native-publisher layout so CVMFS_UPSTREAM_STORAGE points
      # to the gateway API (not the local CAS), matching what the gateway receiver
      # expects from this kind of publisher.
      - ${TESTBED_ROOT}/config/native-publisher:/etc/cvmfs/repositories.d/${REPO_NAME}:ro
      # Repository CAS — read-write so cvmfs_server publish can update .cvmfspublished.
      - ${TESTBED_ROOT}/repos/${REPO_NAME}:/srv/cvmfs/${REPO_NAME}
      # Dedicated publisher spool for bootstrap.  Separate from data/native-ingest
      # used by cvmfs-native-publisher to avoid lock-file conflicts.
      - ${TESTBED_ROOT}/data/bootstrap-spool:/var/spool/cvmfs
    depends_on:
      - gateway
      - stratum0

  # ── Native publisher — cvmfs_server ingest path ───────────────────────────
  # Runs cvmfs_server ingest directly against the gateway, exercising the full
  # native CVMFS server workflow (cvmfs_swissknife → gateway API → cvmfs_receiver).
  # Use ./testbed.sh test --method native or stresstest <n> --method native.
  cvmfs-native-publisher:
    extends:
      file: ./cvmfs-elements/compose/publishers.yml
      service: cvmfs-native-publisher
    environment:
      REPO_NAME: ${REPO_NAME}
      # cvmfs_swissknife and cvmfs_publish are C++ binaries that dlopen shared
      # libs installed into SOFTWARE_ROOT.  LD_LIBRARY_PATH makes them findable
      # without needing ldconfig inside the container.
      LD_LIBRARY_PATH: /opt/cvmfs-software
      RUN_LOG_FILE: /data/runs.ndjson
    volumes:
      # Inject all CVMFS server binaries and shared libraries from SOFTWARE_ROOT.
      - ${SOFTWARE_ROOT}:/opt/cvmfs-software:ro
      - ${SOFTWARE_ROOT}/cvmfs_server:/usr/local/bin/cvmfs_server:ro
      - ${SOFTWARE_ROOT}/cvmfs_swissknife:/usr/local/bin/cvmfs_swissknife:ro
      - ${SOFTWARE_ROOT}/cvmfs_publish:/usr/local/bin/cvmfs_publish:ro
      # Signing keys (.crt, .key, .pub) and gateway key (.gw) for HMAC auth.
      - ${TESTBED_ROOT}/config/keys:/etc/cvmfs/keys:ro
      # Canonical S3 config (directory mount — see the gateway service).
      - ${TESTBED_ROOT}/config/s3:/etc/cvmfs/s3:ro
      # Gateway-mode server.conf: CVMFS_UPSTREAM_STORAGE=gw,... points to the
      # gateway API inside the Docker network.  Generated by init.sh.
      - ${TESTBED_ROOT}/config/native-publisher:/etc/cvmfs/repositories.d/${REPO_NAME}:ro
      # Spool directory for cvmfs_server transaction lock files.
      - ${TESTBED_ROOT}/data/native-ingest:/var/spool/cvmfs
      # Ingest job log — appended by native-stress.sh / native-smoke.sh so the
      # testbed web console can display ingest jobs on the Monitoring tab.
      - ${TESTBED_ROOT}/data/ingest-jobs.ndjson:/data/ingest-jobs.ndjson
      # Run history log — appended at the end of each test run.
      - ${TESTBED_ROOT}/data/runs.ndjson:/data/runs.ndjson
      # ADR-0001: shared canonical test payload (generated once host-side).
      - ${TESTBED_ROOT}/data/payload:/data/payload:ro
      # Read-only access to the repo filesystem so cvmfs_server can read the
      # current .cvmfspublished without going through HTTP (optional but faster).
      - ${TESTBED_ROOT}/repos/${REPO_NAME}:/srv/cvmfs/${REPO_NAME}:ro
    depends_on:
      - gateway
      - stratum0

  # ── CVMFS client ─────────────────────────────────────────────────────────
  # Mounts the CVMFS repository via FUSE so that verify-publish.sh can check
  # that published files are actually visible after a job completes.
  # Intrinsic requirements (SYS_ADMIN, /dev/fuse, apparmor:unconfined) are
  # inherited from the base definition in cvmfs-elements/compose/client.yml.
  cvmfs-client:
    extends:
      file: ./cvmfs-elements/compose/client.yml
      service: cvmfs-client
    environment:
      REPO_NAME: ${REPO_NAME}
      STRATUM0_URL: http://stratum0
      PREPUB_URL: http://cvmfs-prepub:8080
      PREPUB_API_TOKEN: ${PREPUB_API_TOKEN}
    volumes:
      # cvmfs2 and cvmfs_talk binaries from the software partition
      - ${SOFTWARE_ROOT}/cvmfs2:/usr/local/bin/cvmfs2:ro
      - ${SOFTWARE_ROOT}/cvmfs_talk:/usr/local/bin/cvmfs_talk:ro
      # cvmfs2 dlopen()s libcvmfs_fuse3_stub.so (and the fuse2 fallback) from
      # hardcoded paths (/usr/lib, /usr/lib64).  Mount the whole software root
      # read-only so the entrypoint can symlink whichever stub libs are present.
      - ${SOFTWARE_ROOT}:/opt/cvmfs-software:ro
      # Master RSA public key — required by CVMFS_PUBLIC_KEY for whitelist/manifest verification
      - ${TESTBED_ROOT}/config/keys/${REPO_NAME}.pub:/etc/cvmfs/keys/${REPO_NAME}.pub:ro
      # X.509 signing certificate (kept for reference, not used by client config)
      - ${TESTBED_ROOT}/config/keys/${REPO_NAME}.crt:/etc/cvmfs/keys/${REPO_NAME}.crt:ro
      # Client-side disk cache backed by the testbed data directory
      - ${TESTBED_ROOT}/data/cvmfs-client:/var/cache/cvmfs
    depends_on:
      - cvmfs-prepub
      - stratum0

  # ── Monitoring stack ──────────────────────────────────────────────────────
  # Base definitions (images, commands, host-path volumes for cadvisor and
  # node-exporter) are fully specified in cvmfs-elements/compose/monitoring.yml.
  # Only deployment-specific data directories are added here.

  victoriametrics:
    extends:
      file: ./cvmfs-elements/compose/monitoring.yml
      service: victoriametrics
    volumes:
      - ${TESTBED_ROOT}/data/monitoring/vm:/victoria-metrics-data
    ports:
      - "8428:8428"

  vmagent:
    extends:
      file: ./cvmfs-elements/compose/monitoring.yml
      service: vmagent
    volumes:
      - ${TESTBED_ROOT}/data/monitoring/vmagent:/vmagentdata
    depends_on:
      - victoriametrics

  cadvisor:
    extends:
      file: ./cvmfs-elements/compose/monitoring.yml
      service: cadvisor

  node-exporter:
    extends:
      file: ./cvmfs-elements/compose/monitoring.yml
      service: node-exporter

  # CORS proxy in front of VictoriaMetrics so the bits-console dashboard can
  # query it from the browser. Publishes host :8430 (bits-console
  # config/monitoring.yaml metrics_url -> http://<host>:8430).
  vm-cors:
    extends:
      file: ./cvmfs-elements/compose/monitoring.yml
      service: vm-cors
    ports:
      - "8430:80"
    depends_on:
      - victoriametrics

  # http_sd endpoint: discovers the runner fleet's node-exporters from the GitLab
  # Runners API so vmagent scrapes them dynamically. Serves [] (harmless) until
  # RUNNER_SD_TOKEN is set in .env; needs a token that can list runners + read
  # their ip_address (project Maintainer/Owner, or admin for instance-wide).
  runner-sd:
    extends:
      file: ./cvmfs-elements/compose/monitoring.yml
      service: runner-sd
    environment:
      GITLAB_URL:         ${GITLAB_URL:-https://gitlab.cern.ch}
      RUNNER_SD_TOKEN:    ${RUNNER_SD_TOKEN:-}
      PROJECT_ID:         ${RUNNER_SD_PROJECT_ID:-}
      NODE_EXPORTER_PORT: ${NODE_EXPORTER_PORT:-9100}
      ONLY_DESC_REGEX:    ${RUNNER_SD_DESC_REGEX:-}

  # ── minio — S3 endpoint for the direct-to-S3 ingest variant ────────────────
  # Behind a compose profile, so it does not start unless asked for:
  #
  #     docker compose --profile s3 up -d
  #
  # Without the profile these two services are not even instantiated, so a
  # broken image, a slow healthcheck or missing credentials cannot fail
  # `make start` for anyone who is not using the variant.  An earlier version
  # started them unconditionally and gated minio-init on service_healthy, which
  # under `set -e` in cmd_start would have taken the whole testbed down.
  #
  # Tags are pinned: `latest` on an image the testbed depends on means an
  # upstream push can break a working checkout with no local change.
  #
  # Credentials come from .env.s3, interpolated with a `:-` DEFAULT rather than
  # `:?` required.  Compose interpolates the whole file before profiles are
  # applied, so a `:?` here fails `config`, `up`, `down` and everything else for
  # someone who has no .env.s3 — the profile does NOT protect them.  Verified.
  # Empty credentials are instead refused at the point of enabling, by
  # `make s3-on`, which is the only thing that turns the profile on.
  minio:
    profiles: ["s3"]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: cvmfs-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      - ${TESTBED_ROOT}/data/minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - cvmfs-net
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24

  # One-shot: create the bucket and make it world-readable, so a CVMFS client
  # can fetch objects over plain HTTP the way it would from stratum0.
  minio-init:
    profiles: ["s3"]
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: cvmfs-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      S3_BUCKET: ${S3_BUCKET:-cvmfs}
    entrypoint: >
      /bin/sh -c "
        mc alias set tb http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
        mc mb --ignore-existing tb/\"$$S3_BUCKET\" &&
        mc anonymous set download tb/\"$$S3_BUCKET\" &&
        echo 'minio-init: bucket ready'
      "
    networks:
      - cvmfs-net
    restart: "no"

networks:
  cvmfs-net:
    driver: bridge
