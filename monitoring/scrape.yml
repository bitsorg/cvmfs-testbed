global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'cvmfs-prepub'
    static_configs:
      - targets: ['cvmfs-prepub:8080']
    metrics_path: '/api/v1/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'cvmfs-prepub'

  - job_name: 'cvmfs-gateway'
    static_configs:
      - targets: ['gateway:4929']
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'gateway'

  - job_name: 'stratum1-a'
    static_configs:
      - targets: ['stratum1-a:9100']
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'stratum1-a'

  - job_name: 'stratum1-b'
    static_configs:
      - targets: ['stratum1-b:9100']
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'stratum1-b'
