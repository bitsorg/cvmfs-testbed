# docker-compose.pull.yml — Override file that switches the data plane from
# push (legacy) to ADR-0001 pull-based Stratum-1 distribution.
#
# Usage (ALWAYS layered on top of the MQTT overlay — pull needs the control
# plane to deliver the prepare/announce that triggers each receiver's pull):
#
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.mqtt.yml \
#                  -f docker-compose.pull.yml up -d
#
# The testbed.sh `--pull` flag wires this up for you (and implies --mqtt).
#
# What this changes vs the MQTT overlay:
#   - cvmfs-prepub (Stratum 0 publisher) runs with --distribute-mode pull, so it
#     SERVES the per-transaction manifest (GET /s1/{txn}/manifest) and the
#     content-addressed objects (GET /cvmfs/{repo}/data/..) and gates the commit
#     on an authoritative warm quorum, instead of PUSHing objects to receivers.
#   - Each Stratum 1 receiver runs with --distribute-mode pull, so on a prepare
#     announce it fetches the manifest from S0 and pulls only the objects it is
#     missing (content-addressed, atomic install), then acks "warm".
#
# The inbound data listener (TCP 9101 push) is left bound for backward
# compatibility during the cut-over (#52); in pull mode it simply receives no
# traffic. Object hashes are unchanged, so a repo warmed by push and one warmed
# by pull are byte-for-byte identical.

services:

  cvmfs-prepub:
    depends_on:
      - gateway
      - stratum0
      - mosquitto
    command: >
      /usr/local/bin/cvmfs-prepub
      --config /etc/cvmfs-prepub/config.yaml
      --broker-url tcp://mosquitto:1883
      --distribute-mode pull

  stratum1-a:
    depends_on:
      - mosquitto
    command: >
      /usr/local/bin/cvmfs-prepub
      --config /etc/cvmfs-prepub/config.yaml
      --broker-url tcp://mosquitto:1883
      --node-id stratum1-a
      --repos ${REPO_NAME}
      --receiver-stratum0-url http://stratum0/cvmfs
      --distribute-mode pull

  stratum1-b:
    depends_on:
      - mosquitto
    command: >
      /usr/local/bin/cvmfs-prepub
      --config /etc/cvmfs-prepub/config.yaml
      --broker-url tcp://mosquitto:1883
      --node-id stratum1-b
      --repos ${REPO_NAME}
      --receiver-stratum0-url http://stratum0/cvmfs
      --distribute-mode pull
