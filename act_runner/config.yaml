# act_runner configuration for the cvmfs-bits testbed
#
# Copy this file to the location where act_runner is installed, e.g.:
#   /etc/act_runner/config.yaml
#
# Then register the runner once (using the token printed by the seeder):
#   act_runner register \
#     --instance http://localhost:3000 \
#     --token <TOKEN_FROM_SEEDER> \
#     --name bits-host-runner \
#     --labels self-hosted,bits,ubuntu-latest \
#     --no-interactive
#
# The runner configuration (.runner) is written automatically.
# Subsequent starts use: act_runner daemon --config /etc/act_runner/config.yaml

log:
  # "debug", "info", "warn", "error"
  level: info

runner:
  # Display name shown in the Gitea UI
  name: bits-host-runner

  # Labels this runner advertises.
  # bits-publish.yaml requests: runs-on: [self-hosted, bits]
  labels:
    - self-hosted
    - bits
    - ubuntu-latest

  # Where job workspaces are created on the host.
  # The host runner shares the Docker socket, so jobs can spawn containers.
  work_dir: /tmp/act_runner_work

  # Maximum number of concurrent jobs.
  capacity: 4

  # Per-runner environment variables injected into every job.
  # Use this to point a runner at a specific cvmfs-prepub instance so that
  # different runner pools can publish to different prepub servers, all driven
  # by the same bits-console project.  No project-level CI variables needed.
  #
  # In the testbed these values are filled in by init.sh from .env.
  # On a real runner host set them here (or pass via systemd EnvironmentFile).
  envs:
    PREPUB_URL:       "http://cvmfs-prepub:8080"
    PREPUB_API_TOKEN: ""   # filled by init.sh / set manually on real runners

  # Polling interval when there are no pending jobs.
  fetch_interval: 2s

  # How long the runner will wait before declaring a job timed out.
  # The workflow itself has a timeout-minutes: 60 guard; this is a hard cap.
  job_timeout: 3h

cache:
  # Local action cache directory (stores downloaded actions).
  dir: /tmp/act_runner_cache

  # The runner serves a local artifact cache so jobs can cache/restore files
  # without needing external storage.  Set to empty to disable.
  host: ""
  port: 0

container:
  # The runner spawns Docker containers for jobs that specify a container image.
  # docker_host is used for those; leave empty to use the system default.
  docker_host: ""

  # Whether to pull images before running — set to false if offline.
  force_pull: true
