# mosquitto.conf — Mosquitto MQTT broker configuration for the cvmfs-prepub
# testbed.  This is a minimal configuration suitable for dev/test only;
# it uses no authentication or TLS so that the MQTT control-plane path can be
# exercised without certificate management overhead.
#
# Production deployments should enable:
#   - password_file or plugin-based authentication
#   - TLS listener (cafile, certfile, keyfile) on port 8883
#   - ACL rules (acl_file) restricting topic write access per client
#   - persistence_location on a durable volume

# ── Network ───────────────────────────────────────────────────────────────────
# Listen on all interfaces inside the container network on the standard MQTT
# port.  The port is not published to the host in docker-compose.yml (internal
# only), so it is reachable only by other containers on cvmfs-net.
listener 1883
allow_anonymous true

# ── Persistence ───────────────────────────────────────────────────────────────
# Persist messages and retained topics across broker restarts.  The data
# directory is backed by a host volume so state survives container recreation.
persistence true
persistence_location /mosquitto/data/

# ── Logging ──────────────────────────────────────────────────────────────────
# Log to stdout (visible via docker compose logs mosquitto) and to a file.
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ── Connection limits ─────────────────────────────────────────────────────────
# Generous limits for the testbed; reduce for production.
max_connections -1
max_inflight_messages 100
max_queued_messages 1000
message_size_limit 65536

# ── Keep-alive ────────────────────────────────────────────────────────────────
# Clients that use the default keep-alive of 60 s will be detected as gone
# within two keep-alive intervals if they disconnect unexpectedly.  The LWT
# message published by cvmfs-prepub receivers relies on this behaviour to
# signal unexpected disconnects back to the publisher.
