version: '3.9'

# docker-compose.bits.yml — Overlay that adds Gitea (git hosting + bits-console Pages)
# and the one-shot seeder to the CVMFS testbed.
#
# Usage (always combined with the base file):
#   docker compose -f docker-compose.yml -f docker-compose.bits.yml up -d
#
# What this adds:
#   gitea   — Gitea git server.  Serves the bits-console SPA via Gitea Pages at
#             http://testbed.localhost:3000/bits-project/testbed/
#             and the REST API at http://localhost:3000/api/v1/
#
#   seeder  — One-shot Python container that runs after Gitea is healthy:
#               1. Creates the 'testbed' organisation and 'bits-project' repository.
#               2. Pushes bits-console source (+ testbed community + Gitea workflow)
#                  to the 'main' branch.
#               3. Builds the Pages static tree and pushes to 'gh-pages'.
#               4. Creates repository CI variables and secrets.
#               5. Prints the runner registration token so act_runner can be
#                  set up on the host (see act_runner/ for config + systemd unit).
#
# The act_runner is NOT a Docker service — it runs on the physical host as a
# systemd service.  See act_runner/act_runner.service and act_runner/config.yaml.
#
# Required env vars (added to .env by init.sh):
#   GITEA_ADMIN_USER      Admin username (created automatically on first start)
#   GITEA_ADMIN_PASSWORD  Admin password
#   GITEA_SECRET_KEY      Random secret for session signing (init.sh generates this)
#   GITEA_INTERNAL_TOKEN  Random token for internal Gitea services (init.sh generates this)
#   BITS_CONSOLE_SRC      Absolute path to the bits-console source tree on the host
#
# CORS:  bits-console Pages run on http://testbed.localhost:3000 (different origin
#        from the API at http://localhost:3000).  CORS is enabled for that origin.
#        Modern browsers resolve *.localhost to 127.0.0.1 without /etc/hosts.
#        Safari requires: echo "127.0.0.1 testbed.localhost" | sudo tee -a /etc/hosts

services:
  # ── Grafana port override ─────────────────────────────────────────────────
  # The base compose file exposes Grafana on :3000.  When this overlay is
  # active, Gitea also needs :3000.  Move Grafana to :3001 to avoid conflict.
  grafana:
    ports:
      - "3001:3000"

  gitea:
    image: gitea/gitea:1.21
    container_name: cvmfs-gitea
    environment:
      # ── Gitea identity ────────────────────────────────────────────────────────
      USER_UID: 1000
      USER_GID: 1000

      # ── Server ────────────────────────────────────────────────────────────────
      GITEA__server__DOMAIN:      localhost
      GITEA__server__ROOT_URL:    http://localhost:3000/
      GITEA__server__HTTP_PORT:   "3000"
      # Pages served at http://{org}.localhost:3000/{repo}/
      GITEA__server__PAGES_DOMAIN: localhost

      # ── Database (SQLite — suitable for testbed) ──────────────────────────────
      GITEA__database__DB_TYPE: sqlite3
      GITEA__database__PATH:    /data/gitea/gitea.db

      # ── Security ─────────────────────────────────────────────────────────────
      GITEA__security__INSTALL_LOCK:       "true"
      GITEA__security__SECRET_KEY:         ${GITEA_SECRET_KEY}
      GITEA__security__INTERNAL_TOKEN:     ${GITEA_INTERNAL_TOKEN}
      GITEA__security__PASSWORD_HASH_ALGO: pbkdf2

      # ── Admin user (created on first start by the entrypoint) ─────────────────
      # These env vars are handled by the gitea/gitea Docker entrypoint script.
      GITEA_ADMIN_USER:   ${GITEA_ADMIN_USER}
      GITEA_ADMIN_PASSWD: ${GITEA_ADMIN_PASSWORD}
      GITEA_ADMIN_EMAIL:  admin@testbed.local

      # ── Registration ─────────────────────────────────────────────────────────
      # Disable public registration; only the seeder creates accounts.
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW:  "false"

      # ── CORS ─────────────────────────────────────────────────────────────────
      # bits-console Pages are served at testbed.localhost:3000; the SPA calls
      # the Gitea API at localhost:3000 — different origin, so CORS is needed.
      GITEA__cors__ENABLED:           "true"
      GITEA__cors__ALLOW_DOMAIN:      "http://testbed.localhost:3000"
      GITEA__cors__ALLOW_CREDENTIALS: "true"

      # ── Actions (Gitea CI/CD) ─────────────────────────────────────────────────
      GITEA__actions__ENABLED: "true"
      # Actions fetch third-party actions from GitHub by default.
      # Override if your host has no internet access:
      #   GITEA__actions__DEFAULT_ACTIONS_URL: https://github.com
      GITEA__actions__DEFAULT_ACTIONS_URL: https://github.com

      # ── Mailer (disabled — no email in testbed) ───────────────────────────────
      GITEA__mailer__ENABLED: "false"

    volumes:
      - ${TESTBED_ROOT}/data/gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"     # Gitea web + API  (http://localhost:3000)
      - "2222:22"       # SSH git          (optional; use if you want git over SSH)
    networks:
      - cvmfs-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/v1/version"]
      interval: 10s
      timeout: 5s
      retries: 60         # up to 10 minutes — first start initialises the database
      start_period: 30s

  seeder:
    image: cvmfs-seeder:latest
    container_name: cvmfs-seeder
    build:
      context: ./seeder
    environment:
      GITEA_URL:            http://gitea:3000
      GITEA_ADMIN_USER:     ${GITEA_ADMIN_USER}
      GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD}
      GITEA_ORG:            testbed
      GITEA_REPO:           bits-project
      # URLs visible to the act_runner on the HOST (not inside Docker Compose).
      # act_runner runs on the host; it reaches Gitea and cvmfs-prepub via localhost.
      PREPUB_URL:           http://localhost:8080
      PREPUB_API_TOKEN:     ${PREPUB_API_TOKEN}
      CVMFS_REPO:           ${REPO_NAME}
      METRICS_URL:          http://localhost:8428
    volumes:
      # bits-console source tree mounted read-only; seeder pushes it to Gitea.
      - ${BITS_CONSOLE_SRC}:/bits-console:ro
    networks:
      - cvmfs-net
    depends_on:
      gitea:
        condition: service_healthy
    restart: "no"       # run once; exit 0 means done, any other code means failure
