# docker-compose.mqtt.yml — Override file that enables the MQTT control-plane
# path for the cvmfs-prepub testbed.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.mqtt.yml up -d
#
# What this changes vs the base compose file:
#   - Adds Mosquitto from the canonical base in cvmfs-elements/compose/mqtt.yml,
#     with testbed-specific data and log volumes (mosquitto.conf is in the base).
#   - Passes --broker-url to cvmfs-prepub so it uses MQTT for the announce/
#     ready exchange AND for post-commit PublishedMessage notifications.
#   - Passes --broker-url, --node-id, --repos, and --receiver-stratum0-url to
#     both Stratum 1 receivers so they subscribe to the broker for job
#     notifications AND pull new objects from S0 on commit.
#   - Passes MQTT_BROKER_HOST / MQTT_BROKER_PORT to the native publisher so
#     that native-stress.sh can publish commit notifications via mosquitto_pub.
#
# The data plane (CAS object PUTs from publisher to receivers on TCP 9101)
# is unchanged; MQTT replaces only the control-plane signalling.

services:

  # ── Mosquitto MQTT broker ─────────────────────────────────────────────────
  # Only activated when this overlay file is included (--mqtt flag).
  # Not exposed on any host port — only reachable by containers on cvmfs-net.
  # mosquitto.conf is inherited from cvmfs-elements/compose/mqtt.yml.
  mosquitto:
    extends:
      file: ./cvmfs-elements/compose/mqtt.yml
      service: mosquitto
    volumes:
      - ${TESTBED_ROOT}/data/mosquitto:/mosquitto/data
      - ${TESTBED_ROOT}/data/mosquitto-log:/mosquitto/log

  cvmfs-prepub:
    depends_on:
      - gateway
      - stratum0
      - mosquitto
    command: >
      /usr/local/bin/cvmfs-prepub
      --config /etc/cvmfs-prepub/config.yaml
      --broker-url tcp://mosquitto:1883

  # Inject MQTT broker coordinates into the native publisher so that
  # native-stress.sh can call mosquitto_pub to broadcast commit notifications.
  cvmfs-native-publisher:
    depends_on:
      - mosquitto
    environment:
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: "1883"
      STRATUM0_URL: http://stratum0

  stratum1-a:
    depends_on:
      - mosquitto
    command: >
      /usr/local/bin/cvmfs-prepub
      --config /etc/cvmfs-prepub/config.yaml
      --broker-url tcp://mosquitto:1883
      --node-id stratum1-a
      --repos ${REPO_NAME}
      --receiver-stratum0-url http://stratum0/cvmfs

  stratum1-b:
    depends_on:
      - mosquitto
    command: >
      /usr/local/bin/cvmfs-prepub
      --config /etc/cvmfs-prepub/config.yaml
      --broker-url tcp://mosquitto:1883
      --node-id stratum1-b
      --repos ${REPO_NAME}
      --receiver-stratum0-url http://stratum0/cvmfs
