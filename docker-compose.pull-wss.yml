# docker-compose.pull-wss.yml — ADR-0001 pull distribution with the control
# plane running as an in-process MQTT broker on Stratum 0, exposed over
# WebSocket (no separate mosquitto). Layered on the BASE compose only:
#
#   docker compose -f docker-compose.yml -f docker-compose.pull-wss.yml up -d
#
# The testbed.sh `--wss` flag wires this up. vs the mosquitto pull overlay:
#   - cvmfs-prepub embeds the broker (--embedded-broker-ws-addr :1882) and
#     advertises it via the discovery doc (GET /cvmfs/{repo}/.cvmfsbits on :8080).
#   - Each Stratum 1 receiver learns its broker URL from that fixed S0 endpoint
#     (--discovery-url) instead of a hard-coded --broker-url; it then connects
#     over ws://cvmfs-prepub:1882 and pulls on the published notification.

services:

  cvmfs-prepub:
    depends_on:
      - gateway
      - stratum0
    volumes:
      - ${TESTBED_ROOT}/config/broker-tls:/etc/cvmfs-prepub/tls:ro
      - ${TESTBED_ROOT}/config/discovery-keys:/etc/cvmfs-prepub/discovery-keys:ro
      # Coarse-publish finalize (ADR-0007): cvmfs_swissknife + its shared libs,
      # and the ingestsql gateway-client config (config, gatewaykey, pubkey — all
      # real files written by init.sh; a file bind-mount into this :ro dir would
      # fail to create its mountpoint).
      - ${SOFTWARE_ROOT}:/opt/cvmfs-software:ro
      - ${TESTBED_ROOT}/config/cvmfs-prepub/gateway-client:/etc/cvmfs-prepub/gateway-client:ro
    command: >
      /usr/local/bin/cvmfs-prepub
      --config /etc/cvmfs-prepub/config.yaml
      --embedded-broker-ws-addr :1882
      --control-plane-url wss://cvmfs-prepub:1882
      --embedded-broker-tls-cert /etc/cvmfs-prepub/tls/server.crt
      --embedded-broker-tls-key /etc/cvmfs-prepub/tls/server.key
      --broker-ca-cert /etc/cvmfs-prepub/tls/ca.crt
      --embedded-broker-auth
      --prewarm
      --enroll-tls-addr :8443
      --enroll-url https://cvmfs-prepub:8443
      --discovery-signing-key /etc/cvmfs-prepub/discovery-keys/discovery.key
      --pull-object-base-url http://cvmfs-prepub:8080
      --ingest-swissknife /opt/cvmfs-software/cvmfs_swissknife
      --ingest-config-prefix /etc/cvmfs-prepub/gateway-client/
      --ingest-env LD_LIBRARY_PATH=/opt/cvmfs-software
      --ingest-publish

  stratum1-a:
    depends_on:
      - cvmfs-prepub
      - stratum0
    environment:
      PREPUB_HMAC_SECRET: ""
      PREPUB_NODE_KEY: ${PREPUB_NODE_KEY_STRATUM1_A}
    volumes:
      - ${TESTBED_ROOT}/config/broker-tls/ca.crt:/etc/cvmfs-prepub/tls/ca.crt:ro
      - ${TESTBED_ROOT}/config/discovery-keys/discovery.pub:/etc/cvmfs-prepub/discovery.pub:ro
    command: >
      /usr/local/bin/cvmfs-prepub
      --config /etc/cvmfs-prepub/config.yaml
      --node-id stratum1-a
      --repos ${REPO_NAME}
      --receiver-stratum0-url http://cvmfs-prepub:8080
      --discovery-url http://cvmfs-prepub:8080
      --broker-ca-cert /etc/cvmfs-prepub/tls/ca.crt
      --discovery-verify-key /etc/cvmfs-prepub/discovery.pub
      --pull-concurrency 8
      --pull-files-per-request 16
      --broker-auth

  stratum1-b:
    depends_on:
      - cvmfs-prepub
      - stratum0
    environment:
      PREPUB_HMAC_SECRET: ""
      PREPUB_NODE_KEY: ${PREPUB_NODE_KEY_STRATUM1_B}
    volumes:
      - ${TESTBED_ROOT}/config/broker-tls/ca.crt:/etc/cvmfs-prepub/tls/ca.crt:ro
      - ${TESTBED_ROOT}/config/discovery-keys/discovery.pub:/etc/cvmfs-prepub/discovery.pub:ro
    command: >
      /usr/local/bin/cvmfs-prepub
      --config /etc/cvmfs-prepub/config.yaml
      --node-id stratum1-b
      --repos ${REPO_NAME}
      --receiver-stratum0-url http://cvmfs-prepub:8080
      --discovery-url http://cvmfs-prepub:8080
      --broker-ca-cert /etc/cvmfs-prepub/tls/ca.crt
      --discovery-verify-key /etc/cvmfs-prepub/discovery.pub
      --pull-auto
      --broker-auth
