# CORS proxy for the testbed VictoriaMetrics.
#
# VictoriaMetrics serves the query API but sends no CORS headers, so the
# bits-console dashboard (a different origin — GitLab Pages) cannot query it
# from the browser. This nginx adds the headers and proxies to the VM by its
# compose service name on cvmfs-net. Read-only query traffic.
server {
    listen 80;

    location / {
        # Read-only proxy: only GET (queries) and OPTIONS (CORS preflight) are
        # allowed through. This blocks VictoriaMetrics write/admin endpoints
        # (/api/v1/write, /api/v1/admin/tsdb/delete_series, …) that would
        # otherwise be reachable unauthenticated via this proxy. Without it the
        # "GET, OPTIONS" advertised below is not actually enforced by nginx.
        limit_except GET OPTIONS {
            deny all;
        }

        proxy_pass http://victoriametrics:8428;
        proxy_set_header Host $host;

        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}
