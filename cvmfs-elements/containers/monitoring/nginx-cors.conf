# CORS proxy for the testbed VictoriaMetrics.
#
# VictoriaMetrics serves the query API but sends no CORS headers, so the
# bits-console dashboard (a different origin — GitLab Pages) cannot query it
# from the browser. This nginx adds the headers and proxies to the VM by its
# compose service name on cvmfs-net. Read-only query traffic.
server {
    listen 80;

    location / {
        proxy_pass http://victoriametrics:8428;
        proxy_set_header Host $host;

        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}
