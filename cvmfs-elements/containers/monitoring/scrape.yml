global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'cvmfs-prepub'
    static_configs:
      - targets: ['cvmfs-prepub:8080']
    metrics_path: '/api/v1/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'cvmfs-prepub'

  # cvmfs-gateway does not expose a Prometheus /metrics endpoint;
  # its port 4929 serves only the lease API (/api/v1/...).

  - job_name: 'stratum1-a'
    static_configs:
      - targets: ['stratum1-a:9100']
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'stratum1-a'

  - job_name: 'stratum1-b'
    static_configs:
      - targets: ['stratum1-b:9100']
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'stratum1-b'

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'cadvisor'

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'host'

  # Dynamic GitLab-runner node-exporters, discovered from the GitLab Runners API
  # via the runner-sd service (Prometheus http_sd). Runners are added/removed from
  # the fleet without editing this file; runner-sd sets each target's instance/job
  # labels. Runner-sd serves [] until RUNNER_SD_TOKEN is configured.
  - job_name: 'runner-nodes'
    metrics_path: '/metrics'
    http_sd_configs:
      - url: 'http://runner-sd:8080/'
        refresh_interval: 60s
